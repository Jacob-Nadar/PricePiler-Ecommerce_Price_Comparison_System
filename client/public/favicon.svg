<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PricePiler">
  <style>
    .tile { fill: #0b0e12; }
    .bar { fill: #f2f4f7; }
    .signal { fill: #2cbf92; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f2f4f7; }
      .bar { fill: #0b0e12; }
    }
  </style>
  <rect width="32" height="32" rx="8" class="tile" />
  <rect x="7.5" y="8.5" width="4.5" height="16.5" rx="1.5" class="bar" />
  <rect x="13.75" y="13.5" width="4.5" height="11.5" rx="1.5" class="signal" />
  <rect x="20" y="18" width="4.5" height="7" rx="1.5" class="bar" />
</svg>
